[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-the-agent"
version = "0.1.0"
description = "Markdown-as-context tools for LangChain agents. No embeddings, no vector DB."
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Chinmay Deshpande", email = "chinmaydeshpande34@gmail.com" }]
dependencies = [
    "langchain-core>=1.0.0",
    "pydantic>=2.0",
    "markitdown>=0.0.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]
