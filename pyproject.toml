[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-the-agent"
version = "0.1.0"
description = "Markdown-as-context tools for LangChain agents. No embeddings, no vector DB."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "langchain-core>=1.0.0",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
